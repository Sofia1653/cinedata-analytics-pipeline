resources:
  jobs:
    cinedata_pipeline:
      name: cinedata_pipeline
      schedule:
        quartz_cron_expression: 9 0 10 * * ?
        timezone_id: America/Recife
        pause_status: UNPAUSED
      tasks:
        - task_key: to_Bronze
          notebook_task:
            notebook_path: /Workspace/Users/sofiagtenorio@gmail.com/Landing_to_Bronze
            source: WORKSPACE
        - task_key: to_Silver
          depends_on:
            - task_key: to_Bronze
          notebook_task:
            notebook_path: /Workspace/Users/sofiagtenorio@gmail.com/Bronze_to_Silver
            source: WORKSPACE
        - task_key: to_Gold
          depends_on:
            - task_key: to_Silver
          notebook_task:
            notebook_path: /Workspace/Users/sofiagtenorio@gmail.com/Silver_to_Gold
            source: WORKSPACE
      queue:
        enabled: true
      performance_target: PERFORMANCE_OPTIMIZED
